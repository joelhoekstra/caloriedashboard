<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nutrition</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutrition">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10191c">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  html,body{height:100%;margin:0;background:#10191c;color:#e8f0ee;font-family:system-ui,sans-serif}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
  iframe{display:block;width:100%;height:100%;border:0}
  p{padding:24px}
</style>
</head>
<body>
<p id="msg" hidden></p>
<iframe id="app" title="Nutrition dashboard" hidden></iframe>
<script>
  // Paste your Apps Script web app URL (ends in /exec) between the quotes:
  var EXEC = "https://script.google.com/macros/s/AKfycbwUEw0EVhcrtKD03sjbwHLrPBoUndFcIhzdiEykpcaAeqB28nvXHSOIA2V1vsTbGVg_Lg/exec";

  // The secret key comes from the page address after the # sign, e.g.
  // https://YOU.github.io/nutrition/#YOUR_KEY  (it is never stored in the repo)
  var key = decodeURIComponent(location.hash.slice(1));
  try {
    if (key) localStorage.setItem("k", key); else key = localStorage.getItem("k") || "";
  } catch (e) {}

  var msg = document.getElementById("msg"), app = document.getElementById("app");
  if (EXEC.indexOf("http") !== 0) {
    msg.textContent = "Set the EXEC URL in index.html."; msg.hidden = false;
  } else if (!key) {
    msg.textContent = "Missing key. Open this page with #YOUR_KEY at the end of the address."; msg.hidden = false;
  } else {
    app.src = EXEC + "?k=" + encodeURIComponent(key);
    app.hidden = false;
  }
</script>
</body>
</html>
